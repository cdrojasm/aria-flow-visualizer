<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA — UX Data Mapping</title>
<style>
  :root {
    --bg:#fafaf9; --navy:#0a2249; --blue:#1464a5; --blue-soft:#e8f0fb; --line:#dde3ec;
    --ink:#1c2b45; --mute:#64748b; --card:#fff; --cyan:#c3e7f6;
    --green:#1f9d6b; --amber:#d98a0b; --violet:#6d5bd0; --red:#c0392b;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body::before { content:""; position:fixed; right:-14vw; top:14vh; width:62vw; height:62vw; border-radius:50%;
    background:radial-gradient(circle at 45% 55%,rgba(150,208,240,.5) 0%,rgba(195,231,246,.32) 38%,rgba(225,245,240,.15) 62%,transparent 72%);
    pointer-events:none; z-index:0; }
  code { background:var(--blue-soft); color:var(--blue); padding:.05em .35em; border-radius:5px; font-size:.88em;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  button { font:inherit; }

  /* chrome */
  .top { position:fixed; top:0; left:0; right:0; height:8.5vh; min-height:46px; padding:0 3vw; display:flex; align-items:center; justify-content:space-between; gap:1.5vw; z-index:8; }
  .brand { flex:0 0 auto; display:flex; align-items:center; gap:.6em; font-weight:700; letter-spacing:.2em; color:var(--navy); font-size:clamp(.6rem,.9vw,.8rem); white-space:nowrap; }
  .brand i { width:.7em; height:.7em; border-radius:50%; background:var(--blue); display:inline-block; }
  nav { display:flex; gap:.2vw; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { border:0; background:transparent; color:var(--mute); font-size:clamp(.52rem,.68vw,.68rem); letter-spacing:.06em; text-transform:uppercase; font-weight:600; padding:.45em .55em; border-radius:99px; cursor:pointer; white-space:nowrap; }
  nav button:hover { color:var(--navy); }
  nav button.on { background:var(--navy); color:#fff; }
  .foot { position:fixed; bottom:0; left:0; right:0; height:6vh; min-height:34px; padding:0 3vw; display:flex; align-items:center; justify-content:space-between; color:var(--mute); font-size:clamp(.66rem,.85vw,.8rem); z-index:8; }
  .ctl { display:flex; align-items:center; gap:.7em; }
  .ctl button { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:99px; width:2.1em; height:2.1em; cursor:pointer; }
  .prog { position:fixed; top:0; left:0; height:3px; background:var(--blue); transition:width .3s; z-index:9; }

  /* slides */
  .slide { position:absolute; inset:0; padding:8.8vh 3vw 6.4vh; display:none; flex-direction:column; z-index:1; }
  .slide.active { display:flex; animation:in .3s ease; }
  @keyframes in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .head { flex:0 0 auto; margin-bottom:1vh; display:flex; align-items:flex-end; justify-content:space-between; gap:2vw; flex-wrap:wrap; }
  .eyebrow { color:var(--blue); text-transform:uppercase; letter-spacing:.2em; font-weight:700; font-size:clamp(.62rem,.95vw,.85rem); }
  h1,h2 { color:var(--navy); margin:.15em 0 0; letter-spacing:-.025em; line-height:1.05; font-weight:800; }
  h1 { font-size:clamp(2.6rem,6.4vw,5.4rem); } h2 { font-size:clamp(1.4rem,2.5vw,2.2rem); }
  .lead { color:var(--mute); font-size:clamp(.82rem,1.15vw,1rem); margin:.4em 0 0; max-width:110ch; line-height:1.45; }
  .body { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:1.4vh; overflow:auto; padding:.4vh .2vw; }
  .tags { display:flex; gap:.4em; flex-wrap:wrap; align-items:center; }
  .tag { font-size:clamp(.6rem,.78vw,.74rem); font-weight:700; letter-spacing:.06em; padding:.25em .7em; border-radius:99px; background:var(--blue-soft); color:var(--blue); white-space:nowrap; }
  .tag.new { background:#fdf0dc; color:var(--amber); } .tag.ok { background:#e4f6ee; color:var(--green); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.4vh 1.1vw; box-shadow:0 1px 2px rgba(10,34,73,.04),0 6px 18px rgba(10,34,73,.04); }
  .card h3 { margin:0 0 .3em; color:var(--navy); font-size:clamp(1rem,1.5vw,1.3rem); }
  .card p { margin:0; font-size:clamp(.82rem,1.1vw,1rem); line-height:1.45; color:var(--ink); }
  .m { color:var(--mute); }
  .grid { display:grid; gap:1.2vh 1vw; } .g3 { grid-template-columns:repeat(3,1fr); } .g4 { grid-template-columns:repeat(4,1fr); }

  /* cover */
  .cover { justify-content:center; }
  .cover h1 { font-size:clamp(3rem,8vw,7rem); }
  .cover .stats { display:flex; gap:2.4vw; margin-top:3vh; flex-wrap:wrap; }
  .cover .stat b { display:block; font-size:clamp(1.6rem,3.4vw,3rem); color:var(--navy); letter-spacing:-.03em; }
  .cover .stat span { color:var(--mute); text-transform:uppercase; letter-spacing:.14em; font-size:clamp(.6rem,.85vw,.78rem); font-weight:700; }

  /* how to read */
  .chain { display:grid; grid-template-columns:repeat(4,1fr); gap:1vw; }
  .link { position:relative; }
  .link .n { width:2.1em; height:2.1em; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom:.6em; }
  .link:not(:last-child)::after { content:"›"; position:absolute; right:-.85vw; top:1.6em; color:var(--blue); font-weight:800; font-size:1.5em; }

  /* overview */
  .roles { display:flex; gap:.4em; flex-wrap:wrap; }
  .roles button { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:99px; padding:.35em .9em; cursor:pointer; font-size:clamp(.66rem,.85vw,.8rem); font-weight:600; }
  .roles button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1.4vh 1vw; }
  .vc { cursor:pointer; padding:0; overflow:hidden; transition:transform .2s,box-shadow .2s,opacity .2s; text-align:left; display:flex; flex-direction:column; }
  .vc:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(10,34,73,.1); }
  .vc.dim { opacity:.28; }
  .vc .th { aspect-ratio:16/9; background:#eef2f7; overflow:hidden; border-bottom:1px solid var(--line); }
  .vc .th img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .vc .tx { padding:1vh .8vw 1.2vh; } .vc h3 { font-size:clamp(.9rem,1.2vw,1.05rem); margin:0; }
  .vc .rt { color:var(--mute); font-size:.74rem; font-family:ui-monospace,Menlo,monospace; margin:.15em 0 .5em; }

  /* view slide */
  .stage { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:1.1vw; }
  .shotwrap .shot { flex:1 1 auto; }
  .shot { position:relative; min-height:0; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 8px 26px rgba(10,34,73,.08); }
  .shotin { position:relative; line-height:0; }
  .shotin img { width:100%; display:block; }
  .zone { position:absolute; border:2px dashed rgba(20,100,165,.75); background:rgba(20,100,165,.07); border-radius:6px; cursor:pointer; transition:all .15s; }
  .zone .bd { position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px; border-radius:0 5px 0 7px; background:var(--blue); color:#fff; font-size:11px; font-weight:800; display:grid; place-items:center; line-height:1; }
  .zone.cm { border-color:rgba(100,116,139,.7); background:rgba(100,116,139,.06); } .zone.cm .bd { background:#64748b; }
  .zone:hover,.zone.hv { background:rgba(20,100,165,.16); }
  .zone.sel { border:3px solid var(--blue); background:rgba(20,100,165,.18); box-shadow:0 0 0 4px rgba(150,208,240,.55); z-index:3; }
  .zone.cm.sel { border-color:#475569; background:rgba(100,116,139,.2); box-shadow:0 0 0 4px rgba(148,163,184,.5); }
  .panel { min-height:0; display:flex; flex-direction:column; gap:1vh; overflow:hidden; }
  .zl { display:flex; flex-wrap:wrap; gap:.35em; flex:0 0 auto; max-height:22vh; overflow:auto; }
  .zb { border:1px solid var(--line); background:#fff; border-radius:99px; padding:.28em .8em .28em .3em; cursor:pointer; display:flex; align-items:center; gap:.5em; font-size:clamp(.66rem,.85vw,.8rem); color:var(--navy); font-weight:600; text-align:left; }
  .zb i { font-style:normal; width:1.7em; height:1.7em; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:grid; place-items:center; font-size:.9em; font-weight:800; flex:0 0 auto; }
  .zb.sel { background:var(--navy); color:#fff; border-color:var(--navy); } .zb.sel i { background:#fff; color:var(--navy); }
  .zb.cm i { background:#e2e8f0; color:#475569; } .zb.nb { border-style:dashed; }
  .zd { flex:1 1 auto; min-height:0; overflow:auto; padding-right:.3vw; }
  .zt { color:var(--navy); font-weight:800; font-size:clamp(1.05rem,1.6vw,1.4rem); letter-spacing:-.02em; margin:0; }
  .lbl { color:var(--blue); text-transform:uppercase; letter-spacing:.14em; font-weight:700; font-size:clamp(.58rem,.75vw,.7rem); margin:1.2vh 0 .4vh; }
  .shows { font-size:clamp(.8rem,1.05vw,.95rem); line-height:1.45; margin:.4vh 0 0; }
  .chips { display:flex; flex-wrap:wrap; gap:.35em; }
  .chip { background:var(--blue-soft); color:var(--blue); border-radius:8px; padding:.2em .6em; font-size:clamp(.66rem,.82vw,.78rem); font-family:ui-monospace,Menlo,monospace; cursor:help; }
  .note { border-left:3px solid var(--amber); background:#fdf6e8; padding:.7vh .8vw; border-radius:0 8px 8px 0; font-size:clamp(.76rem,.95vw,.88rem); margin-top:1vh; }
  .empty { color:var(--mute); font-size:clamp(.78rem,1vw,.9rem); font-style:italic; }

  /* service cards */
  details.svc { border:1px solid var(--line); border-radius:10px; background:#fff; margin:.5vh 0; }
  details.svc > summary { list-style:none; cursor:pointer; padding:.7vh .7vw; display:flex; gap:.6em; align-items:baseline; flex-wrap:wrap; }
  details.svc > summary::-webkit-details-marker { display:none; }
  details.svc[open] > summary { border-bottom:1px solid var(--line); background:#f6f9fd; border-radius:10px 10px 0 0; }
  .mt { font-size:.68rem; font-weight:800; letter-spacing:.06em; padding:.15em .55em; border-radius:6px; color:#fff; flex:0 0 auto; }
  .mt.GET { background:#1f9d6b; } .mt.POST { background:#1464a5; } .mt.PUT,.mt.PATCH { background:#d98a0b; } .mt.DELETE { background:#c0392b; }
  .pth { font-family:ui-monospace,Menlo,monospace; font-size:clamp(.7rem,.9vw,.84rem); color:var(--navy); word-break:break-all; background:none; padding:0; }
  .sm { color:var(--mute); font-size:clamp(.7rem,.85vw,.8rem); }
  .sb { padding:.8vh .9vw 1.2vh; font-size:clamp(.74rem,.92vw,.86rem); }
  .sb table { width:100%; border-collapse:collapse; margin:.3vh 0 .8vh; }
  .sb th { text-align:left; color:var(--mute); font-weight:700; font-size:.72em; text-transform:uppercase; letter-spacing:.08em; padding:.25em .5em; border-bottom:1px solid var(--line); }
  .sb td { padding:.28em .5em; border-bottom:1px dashed var(--line); vertical-align:top; }
  .sb td:first-child { font-family:ui-monospace,Menlo,monospace; color:var(--navy); white-space:nowrap; }
  .req { color:var(--red); font-weight:800; }
  .fl { display:flex; flex-wrap:wrap; gap:.3em; margin:.3vh 0 .8vh; }
  .f { background:#f1f5f9; border-radius:6px; padding:.15em .5em; font-family:ui-monospace,Menlo,monospace; font-size:.9em; color:var(--ink); }
  .f small { color:var(--mute); } .f.r { background:#fde9e6; }
  .ex { font-family:ui-monospace,Menlo,monospace; font-size:.86em; background:#0a2249; color:#cfe5f7; padding:.5em .7em; border-radius:8px; margin:.3vh 0; word-break:break-all; line-height:1.5; }
  .ex b { color:#8fd0a8; } .kvl { color:var(--mute); }

  /* services slide */
  .tools { display:flex; gap:.8em; align-items:center; flex-wrap:wrap; }
  .tools input { border:1px solid var(--line); border-radius:99px; padding:.5em 1em; font:inherit; min-width:min(32ch,100%); background:#fff; }
  .grp { margin-top:1.6vh; } .grp h3 { margin:0 0 .3vh; color:var(--navy); font-size:clamp(.9rem,1.2vw,1.05rem); }
  .grp h3 small { color:var(--mute); font-weight:500; }
  .real table { width:100%; border-collapse:collapse; font-size:clamp(.72rem,.9vw,.84rem); }
  .real th { text-align:left; color:var(--mute); font-size:.74em; text-transform:uppercase; letter-spacing:.08em; padding:.3em .5em; border-bottom:1px solid var(--line); }
  .real td { padding:.35em .5em; border-bottom:1px dashed var(--line); vertical-align:top; }

  /* objects overlay */
  .shotwrap { min-height:0; display:flex; flex-direction:column; gap:.7vh; }
  .tbar { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.35em; align-items:center; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:transparent; padding:.3em .9em; cursor:pointer; font-size:clamp(.66rem,.85vw,.8rem); font-weight:700; color:var(--mute); }
  .seg button.on { background:var(--navy); color:#fff; }
  .nchip { border:1px solid var(--line); background:#fff; border-radius:99px; padding:.25em .7em .25em .5em; cursor:pointer; display:flex; align-items:center; gap:.4em; font-size:clamp(.64rem,.8vw,.76rem); font-weight:600; color:var(--mute); }
  .nchip i { width:.8em; height:.8em; border-radius:3px; border:2px solid var(--c); background:transparent; display:inline-block; }
  .nchip.on { color:var(--ink); border-color:var(--c); } .nchip.on i { background:var(--c); }
  .nchip b { font-weight:800; }
  .cotas-l { display:flex; align-items:center; gap:.35em; font-size:clamp(.64rem,.8vw,.76rem); color:var(--mute); font-weight:600; cursor:pointer; margin-left:.3em; }
  .ob { position:absolute; border:1.5px solid var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); border-radius:3px; cursor:pointer; display:none; z-index:2; transition:opacity .15s; }
  .ob.estatico { --c:#64748b; } .ob.dinamico { --c:#1f9d6b; } .ob.condicional { --c:#0e9aa7; } .ob.control { --c:#d98a0b; } .ob.grafico { --c:#6d5bd0; }
  .ob.contenedor { --c:#1464a5; border-style:dotted; background:transparent; z-index:1; }
  .mo-obj .ob { display:block; } .mo-zone .ob { display:none !important; }
  .mo-obj .zone { pointer-events:none; opacity:.55; } .mo-obj .zone.sel { opacity:1; background:transparent; box-shadow:none; }
  .mo-obj .zone .bd { display:none; }
  .hide-estatico .ob.estatico,.hide-dinamico .ob.dinamico,.hide-condicional .ob.condicional,.hide-control .ob.control,.hide-grafico .ob.grafico,.hide-contenedor .ob.contenedor { display:none !important; }
  .ob.far { opacity:.22; } .ob.hv,.ob.sel { opacity:1; z-index:5; background:color-mix(in srgb,var(--c) 38%,transparent); box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c); }
  .cotas .ob::after { content:attr(data-d); position:absolute; left:0; top:-11px; font-size:8px; line-height:1; font-weight:700; color:#fff; background:var(--c); padding:1px 3px; border-radius:2px; white-space:nowrap; pointer-events:none; }
  #tip { position:fixed; z-index:50; pointer-events:none; background:var(--navy); color:#fff; padding:.55em .75em; border-radius:10px; font-size:12px; line-height:1.4; max-width:320px; box-shadow:0 10px 30px rgba(10,34,73,.3); display:none; }
  #tip b { color:#8fd0e8; } #tip .t { opacity:.8; }
  .ztabs { display:flex; gap:.3em; margin:1.2vh 0 .6vh; border-bottom:1px solid var(--line); }
  .ztabs button { border:0; background:transparent; padding:.45em .9em; cursor:pointer; font-weight:700; color:var(--mute); font-size:clamp(.72rem,.9vw,.84rem); border-bottom:3px solid transparent; }
  .ztabs button.on { color:var(--navy); border-bottom-color:var(--blue); }
  .nt { display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.05em; padding:.15em .6em; border-radius:99px; color:#fff; background:var(--c); white-space:nowrap; }
  .zdim { color:var(--mute); font-size:clamp(.72rem,.9vw,.84rem); margin:.2vh 0 0; font-family:ui-monospace,Menlo,monospace; }
  .otab { width:100%; border-collapse:collapse; font-size:clamp(.7rem,.86vw,.8rem); }
  .otab th { text-align:left; color:var(--mute); font-size:.74em; text-transform:uppercase; letter-spacing:.08em; padding:.3em .4em; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
  .otab td { padding:.3em .4em; border-bottom:1px dashed var(--line); vertical-align:top; }
  .otab tr.or { cursor:pointer; } .otab tr.or:hover,.otab tr.or.sel { background:var(--blue-soft); }
  .otab .sw { display:inline-block; width:.75em; height:.75em; border-radius:3px; background:var(--c); margin-right:.4em; }
  .otab .tx { max-width:19ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .odet { border:2px solid var(--c); border-radius:12px; padding:.9vh .9vw; background:#fff; margin:.8vh 0; font-size:clamp(.74rem,.92vw,.86rem); }
  .odet h4 { margin:.3em 0; color:var(--navy); font-size:1.05em; word-break:break-word; }
  .odet .kv { display:grid; grid-template-columns:auto 1fr; gap:.15em .8em; margin:.5em 0; }
  .odet .kv span:nth-child(odd) { color:var(--mute); font-weight:700; text-transform:uppercase; font-size:.72em; letter-spacing:.08em; padding-top:.15em; }
  .sws { display:inline-block; width:1em; height:1em; border-radius:4px; border:1px solid var(--line); vertical-align:-.15em; margin-right:.3em; }
  /* summary / reuse / measures */
  .sbar { display:flex; height:1.5em; border-radius:6px; overflow:hidden; background:#eef2f7; }
  .sbar span { display:block; height:100%; } .sbar span:hover { filter:brightness(1.1); }
  .srow { display:grid; grid-template-columns:minmax(120px,.34fr) 1fr 3.2em; gap:.8em; align-items:center; padding:.35vh 0; font-size:clamp(.74rem,.95vw,.88rem); cursor:pointer; }
  .srow:hover b { color:var(--blue); } .srow small { color:var(--mute); text-align:right; }
  .leg { display:flex; gap:1em; flex-wrap:wrap; font-size:clamp(.7rem,.85vw,.8rem); color:var(--mute); }
  .leg i { display:inline-block; width:.8em; height:.8em; border-radius:3px; margin-right:.35em; vertical-align:-.05em; }
  .ru { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:1.1vw; flex:1 1 auto; min-height:0; }
  .mx { overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .mxr { display:grid; align-items:center; border-bottom:1px solid var(--line); cursor:pointer; font-size:clamp(.7rem,.86vw,.8rem); }
  .mxr:hover,.mxr.sel { background:var(--blue-soft); }
  .mxr.h { cursor:default; position:sticky; top:0; background:#f6f9fd; z-index:2; align-items:end; } .mxr.h:hover { background:#f6f9fd; }
  .mxr .nm { padding:.45em .6em; font-family:ui-monospace,Menlo,monospace; color:var(--navy); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mxr .cl { text-align:center; padding:.3em 0; } .mxr .cl i { display:inline-block; width:.8em; height:.8em; border-radius:50%; background:var(--blue); } .mxr .cl em { display:inline-block; width:.8em; height:.8em; border-radius:50%; background:#e5eaf1; }
  .mxr.h .cl { writing-mode:vertical-rl; transform:rotate(180deg); font-size:.78em; padding:.5em 0; color:var(--mute); font-weight:700; white-space:nowrap; }
  .mtab { width:100%; border-collapse:collapse; font-size:clamp(.72rem,.9vw,.84rem); }
  .mtab th { text-align:left; color:var(--mute); font-size:.74em; text-transform:uppercase; letter-spacing:.08em; padding:.35em .5em; border-bottom:1px solid var(--line); }
  .mtab td { padding:.4em .5em; border-bottom:1px dashed var(--line); vertical-align:top; } .mtab td:first-child { font-family:ui-monospace,Menlo,monospace; color:var(--navy); }

  /* tabs slide */
  .tabs { display:grid; grid-template-columns:minmax(150px,.28fr) minmax(0,1.1fr) minmax(0,.9fr); gap:1vw; flex:1 1 auto; min-height:0; }
  .tl { overflow:auto; display:flex; flex-direction:column; gap:.6vh; }
  .tl h4 { margin:.8vh 0 .2vh; color:var(--mute); text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; }
  .tb { border:1px solid var(--line); background:#fff; border-radius:10px; padding:.35em; cursor:pointer; text-align:left; display:flex; gap:.5em; align-items:center; font-size:clamp(.68rem,.85vw,.8rem); color:var(--navy); font-weight:600; }

    if (v.real.length || Object.keys(v.restGroups || {}).length) add(sec, `<div class="head"><div><div class="eyebrow">${esc(v.label)} · servicios</div><h2>Servicios de la vista</h2><p class="lead">Llamadas reales al abrir la vista y catálogo completo de servicios que usan sus componentes (incluye pestañas y modales).</p></div><div class="tools"><input type="search" placeholder="Filtrar servicios…" id="q"></div></div><div class="body" id="sb"></div>`, (el) => {
      const sb = $('#sb', el);
      const real = v.real.length ? `<div class="card real"><h3>Llamadas reales al abrir la vista (${v.real.length})</h3><table><tr><th>Método</th><th>Ruta</th><th>Parámetros enviados</th><th>×</th></tr>${v.real.map((r) => `<tr><td><span class="mt ${esc(r.m)}">${esc(r.m)}</span></td><td><code class="pth">${esc(r.p.replace(/[0-9a-f]{8}-[0-9a-f-]{27}/g, '{id}'))}</code></td><td>${Object.entries(r.q).map(([k, val]) => `<span class="f">${esc(k)}=<b>${esc(String(val).length > 26 ? String(val).slice(0, 24) + '…' : val)}</b></span>`).join(' ') || '<span class="m">—</span>'}${r.b ? `<div class="ex">${esc(r.b)}</div>` : ''}</td><td>${r.n}</td></tr>`).join('')}</table><p class="hint" style="margin:.8vh 0 0">Capturadas al abrir la vista con el rango por defecto (los timestamps cambian en cada carga). Las llamadas del layout (p. ej. <code>agent/sessions</code> del panel del asistente) se documentan en Componentes comunes.</p></div>` : '<div class="card"><h3>Sin llamadas al abrir</h3><p class="m">La vista no consulta servicios hasta que el usuario actúa.</p></div>';
      const assigned = v.zones.filter((z) => !z.common).map((z) => ({ t: `${z.n}. ${z.label}`, k: z.svcs })).filter((g) => g.k.length);
      const rest = Object.entries(v.restGroups || {}).map(([g, k]) => ({ t: g, k, rest: true }));
      const groups = [...assigned, ...rest];
      const draw = (q) => {
        const f = (k) => !q || (SV[k].p + ' ' + (SV[k].s || '') + ' ' + SV[k].m + ' ' + (SV[k].uc || []).join(' ')).toLowerCase().includes(q);
        sb.innerHTML = real + groups.map((g) => { const ks = g.k.filter(f); return ks.length ? `<div class="grp"><h3>${esc(g.t)} <small>${g.rest ? '· pestañas y modales (por componente)' : '· zona'} · ${ks.length}</small></h3>${ks.map((k) => svcCard(k)).join('')}</div>` : ''; }).join('') || '';
      };
      draw(''); $('#q', el).oninput = (e) => draw(e.target.value.trim().toLowerCase());
    });
  });

  /* closing */
  add('Cierre', `<div class="head"><div><div class="eyebrow">Cobertura</div><h2>Qué cubre y qué falta</h2></div></div><div class="body"><div class="grid g3">
    <div class="card"><h3>Cubierto</h3><p class="m">13 vistas con captura real, zonas numeradas, componentes, servicios con parámetros/cuerpo/respuesta, caso de uso backend, llamadas reales y pestañas.</p></div>
    <div class="card"><h3>Por completar</h3><p class="m">Propiedades de estado local (la "Properties list" del v1.2), el mapeo campo por campo de cómo se pinta cada valor, modales y estados vacío/error/cargando, y las vistas con los otros 5 roles.</p></div>
    <div class="card"><h3>Datos de las capturas</h3><p class="m">Provienen del entorno local con datos de pruebas E2E; para presentar conviene sembrar un set limpio.</p></div>
  </div></div>`);

  /* ---------- engine ---------- */
  const root = $('#slides'), nav = $('#nav');
  slides.forEach((s, i) => { const el = document.createElement('section'); el.className = 'slide'; el.innerHTML = s.html; root.appendChild(el); s.el = el; });
  const secs = []; slides.forEach((s, i) => { if (!secs.find((x) => x.name === s.sec)) secs.push({ name: s.sec, first: i }); });
  nav.innerHTML = secs.map((s) => `<button data-i="${s.first}">${esc(s.name)}</button>`).join('');
  let cur = -1; const inited = new Set();
  function go(i) {
    if (typeof i === 'string' && i.startsWith('view:')) i = vslides[+i.slice(5)];
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, j) => s.el.classList.toggle('active', j === i));
    const s = slides[i];
    if (!inited.has(i)) { inited.add(i); s.init && s.init(s.el, go); }
    cur = i; history.replaceState(null, '', '#' + (i + 1));
    $('#prog').style.width = ((i + 1) / slides.length * 100) + '%'; $('#cnt').textContent = (i + 1) + ' / ' + slides.length;
    const sec = secs.filter((x) => x.first <= i).pop();
    nav.querySelectorAll('button').forEach((b) => b.classList.toggle('on', +b.dataset.i === sec.first));
    const on = nav.querySelector('.on'); on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (s.el._first) requestAnimationFrame(() => s.el._first());
  }
  nav.onclick = (e) => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); };
  $('#prev').onclick = () => go(cur - 1); $('#next').onclick = () => go(cur + 1);
  addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1); else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(slides.length - 1);
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && slides[cur].el._step) { e.preventDefault(); slides[cur].el._step(e.key === 'ArrowDown' ? 1 : -1); }
  });
  addEventListener('hashchange', () => { const n = (parseInt(location.hash.slice(1)) || 1) - 1; if (n !== cur) go(n); });
  go(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
})();
</script>
</body>
</html>
