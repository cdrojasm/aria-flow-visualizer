# OKD variant of nginx.conf: static files only. /api and /health are routed
# by the backend's proxy nginx (deploy/okd/iac_celery/proxy/nginx), which is
# also the only pod the api NetworkPolicy lets in.
server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA static shell + client-side TanStack Router. Any path without a
    # matching file falls back to index.html, which must not be cached so a
    # new rollout is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
