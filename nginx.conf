server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Dataset uploads are intentionally supported up to 10 GB. Requests over
    # this limit are handled below with the API's JSON error contract.
    client_max_body_size 10g;

    # Nginx otherwise serves an HTML error document for a 413, which clients
    # cannot handle like the API's normal JSON errors.
    error_page 413 = /_errors/request-entity-too-large.json;

    location = /_errors/request-entity-too-large.json {
        internal;
        default_type application/json;
        return 413 '{"detail":"Dataset upload exceeds the 10 GB limit","code":"REQUEST_ENTITY_TOO_LARGE","max_bytes":10737418240}';
    }

    # The SPA shell must be revalidated after each deployment. Hashed assets
    # remain cacheable because their filenames change with the build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA static shell + client-side TanStack Router. Any path without a
    # matching file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the backend (../backend) over the shared aria-net docker
    # network — see src/lib/api/client.ts, which calls these paths relative
    # to the frontend's own origin so no CORS is involved.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streams the upload straight to the backend instead of buffering
        # the whole body in nginx first, keeping memory/disk flat regardless
        # of upload size (dataset CSV / analyst-capacity xlsx imports).
        proxy_request_buffering off;
        # Default 60s read/send timeouts are tight for a large upload over a
        # slow connection.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
