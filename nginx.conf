server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;
    resolver 10.89.0.1 valid=10s ipv6=off;
    set $api_backend api:8000;

    # Default is 1MB - blocks dataset CSV uploads (testing page) well before
    # they reach the api. 200m covers the largest datasets seen so far
    # (~150MB) with headroom.
    client_max_body_size 200m;

    # SPA static shell + client-side TanStack Router. Any path without a
    # matching file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied to the backend (../backend) over the shared aria-net docker
    # network — see src/lib/api/client.ts, which calls these paths relative
    # to the frontend's own origin so no CORS is involved.
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Streams the upload straight to the backend instead of buffering
        # the whole body in nginx first, keeping memory/disk flat regardless
        # of upload size (dataset CSV / analyst-capacity xlsx imports).
        proxy_request_buffering off;
        # Default 60s read/send timeouts are tight for a large upload over a
        # slow connection.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://$api_backend/health;
        proxy_set_header Host $host;
    }
}
