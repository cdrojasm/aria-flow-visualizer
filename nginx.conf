server {
    listen 80;

    # Default is 1MB - blocks dataset CSV uploads (testing page) well before
    # they reach the app. 200m covers the largest datasets seen so far
    # (~150MB) with headroom.
    client_max_body_size 200m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # server-node.mjs buffers the whole request body before handing off
        # to the app anyway, so streaming through nginx first (rather than
        # nginx also buffering the full upload to a temp file) saves nothing
        # here, but keeps nginx's own memory/disk use flat regardless of
        # upload size.
        proxy_request_buffering off;
        # Default 60s read/send timeouts are tight for a large upload over a
        # slow connection.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
